*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;font-family:'Courier New',monospace;overflow-y:auto;padding:8px 0;}
#hud{width:800px;background:#1a1a2e;border:2px solid #444;padding:6px 12px;display:flex;gap:16px;align-items:center;font-size:13px;color:#eee;flex-wrap:wrap;}
#canvas{border:2px solid #444;display:block;cursor:crosshair;position:relative;}
#weaponBar{width:800px;background:#1a1a2e;border:2px solid #444;border-top:none;padding:4px 8px;display:flex;gap:8px;align-items:center;font-size:12px;color:#aaa;}
.wslot{padding:3px 10px;border:1px solid #555;border-radius:3px;color:#ccc;font-size:11px;cursor:pointer;}
.wslot.active{border-color:#ffd700;color:#ffd700;background:#2a2a0a;}
#controls{width:800px;background:#0d0d1a;border:2px solid #333;border-top:none;padding:4px 8px;font-size:10px;color:#666;line-height:1.6;}
/* Keyboard */
#keyboard{width:800px;background:#111;border:2px solid #333;border-top:none;padding:8px;user-select:none;}
.kb-row{display:flex;gap:3px;margin-bottom:3px;justify-content:center;}
.key{display:inline-flex;align-items:center;justify-content:center;background:#1c1c2e;border:1px solid #444;border-bottom:3px solid #222;border-radius:4px;color:#888;font-size:9px;font-family:'Courier New',monospace;cursor:default;transition:background 0.05s,color 0.05s,border-color 0.05s;white-space:pre;text-align:center;line-height:1.2;}
.key.pressed{background:#5500cc;border-color:#9944ff;color:#fff;border-bottom-width:1px;transform:translateY(2px);box-shadow:0 0 8px #7722ff;}
.key.w14{width:56px;height:28px;}
.key.w1{width:28px;height:28px;}
.key.w15{width:42px;height:28px;}
.key.w2{width:56px;height:28px;}
.key.w25{width:70px;height:28px;}
.key.w3{width:84px;height:28px;}
.key.w7{width:196px;height:28px;}
.key.w6{width:168px;height:28px;}
.key.shift{width:84px;height:28px;}
.key.ctrl{width:56px;height:28px;}
.key.alt{width:42px;height:28px;}
.key.enter2{width:56px;height:60px;border-radius:4px;}
#timerBar{width:800px;height:8px;background:#222;border:1px solid #333;display:none;}
#timerFill{height:100%;background:#00cc44;transition:width 0.1s linear;}
</style>
</head>

// ── Audio ─────────────────────────────────────────────────
const AC=new AudioContext();
function playTone(freq,dur,vol=0.3,type='square',decay=true){
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime);
    g.gain.setValueAtTime(vol,AC.currentTime);
    if(decay)g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.start(AC.currentTime);o.stop(AC.currentTime+dur);
  }catch(e){}
}

    }

}

// ── World ─────────────────────────────────────────────────
function gB(r,c){if(r<0||r>=WR||c<0||c>=WC)return BEDROCK;return world[r][c];}
function sB(r,c,v){if(r<0||r>=WR||c<0||c>=WC)return;if(world[r][c]===BEDROCK)return;if(v===AIR&&platRows.has(r))return;world[r][c]=v;}
function solid(r,c){const b=gB(r,c);return b!==AIR&&b!==LAVA;}

function buildW(cols,rows,surf,plats){
  WC=cols;WR=rows;surfRow=surf;world=[];platRows=new Set();lavaList=[];bearTraps=[];
  for(let r=0;r<rows;r++){world[r]=[];for(let c=0;c<cols;c++){
    if(r<surf)world[r][c]=AIR;
    else if(r===surf)world[r][c]=GRASS;
    else if(r<surf+4)world[r][c]=DIRT;
    else if(r<rows-1)world[r][c]=STONE;
    else world[r][c]=BEDROCK;
  }}
  plats.forEach(([r,c,len])=>{for(let cc=c;cc<c+len&&cc<cols;cc++){world[r][cc]=GRASS;platRows.add(r);}});
  for(let i=0;i<Math.floor(cols/10);i++){
    const hc=2+Math.floor(Math.random()*(cols-4));
    const hr=surf+1+Math.floor(Math.random()*3);
    if(gB(hr,hc)!==AIR&&gB(hr,hc)!==BEDROCK)world[hr][hc]=HEALTH;
  }
  for(let i=0;i<Math.floor(cols/8);i++){
    const tc=3+Math.floor(Math.random()*(cols-6));
    bearTraps.push({x:tc*T+4,y:surf*T-10,triggered:false,triggerT:0,resetT:0});
  }
}

}

// ── Physics ───────────────────────────────────────────────
function olap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function moveE(e){
  const WW=WC*T;
  e.x+=e.vx;
  const rt=Math.floor((e.y+1)/T),rb=Math.floor((e.y+e.h-2)/T);
  if(e.vx>0){const col=Math.floor((e.x+e.w-1)/T);for(let r=rt;r<=rb;r++)if(solid(r,col)){e.x=col*T-e.w;e.vx=0;break;}}
  else if(e.vx<0){const col=Math.floor(e.x/T);for(let r=rt;r<=rb;r++)if(solid(r,col)){e.x=(col+1)*T;e.vx=0;break;}}
  e.vy=Math.min(e.vy+GRAV,22);e.y+=e.vy;e.onG=false;
  const cl=Math.floor((e.x+1)/T),cr2=Math.floor((e.x+e.w-2)/T);
  if(e.vy>0){const row=Math.floor((e.y+e.h-1)/T);for(let c=cl;c<=cr2;c++)if(solid(row,c)){e.y=row*T-e.h;e.vy=0;e.onG=true;break;}}
  else if(e.vy<0){const row=Math.floor(e.y/T);for(let c=cl;c<=cr2;c++)if(solid(row,c)){e.y=(row+1)*T;e.vy=0;break;}}
  e.x=Math.max(0,Math.min(WW-e.w,e.x));
}

function spP(x,y,clr,n,spd=6){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spd,vy:(Math.random()-.5)*spd-2,life:35+Math.random()*20,ml:55,clr,sz:2+Math.random()*4});}
function boom(x,y,rad=64){
  spP(x,y,'#ff6600',24);spP(x,y,'#ffcc00',14);sndExplosion();
  const tr=Math.ceil(rad/T);
  for(let dr=-tr;dr<=tr;dr++)for(let dc=-tr;dc<=tr;dc++)
    if(Math.hypot(dr,dc)*T<=rad){const r=Math.floor(y/T)+dr,c=Math.floor(x/T)+dc;if(gB(r,c)!==BEDROCK)sB(r,c,AIR);}
  bears.forEach(b=>{if(b.dead)return;const d=Math.hypot(b.x+b.w/2-x,b.y+b.h/2-y);if(d<rad){hBear(b,Math.floor(40*(1-d/rad)));b.vx+=(b.x+b.w/2-x)/d*8;b.vy-=6;}});
  tanks.forEach(tk=>{if(tk.dead)return;const d=Math.hypot(tk.x+tk.w/2-x,tk.y+tk.h/2-y);if(d<rad){hitTank(tk,Math.floor(60*(1-d/rad)));}});
  if(gooseBoss&&!gooseBoss.dead){const d=Math.hypot(gooseBoss.x+gooseBoss.w/2-x,gooseBoss.y+gooseBoss.h/2-y);if(d<rad)hitBoss(gooseBoss,Math.floor(30*(1-d/rad)));}
  if(karateBear&&!karateBear.dead){const d=Math.hypot(karateBear.x+karateBear.w/2-x,karateBear.y+karateBear.h/2-y);if(d<rad)hitBoss(karateBear,Math.floor(30*(1-d/rad)));}
  const pd=Math.hypot(P.x+P.w/2-x,P.y+P.h/2-y);if(pd<rad)hPlayer(Math.floor(20*(1-pd/rad)));
  fxs.push({x,y,r:0,life:20});
}
function hPlayer(d){if(P.inv>0)return;P.hp=Math.max(0,P.hp-d);P.inv=45;spP(P.x+10,P.y,'#ff2200',8);}
function hBear(b,d){if(b.shocked>0)d=Math.ceil(d*1.5);b.hp-=d;b.hurt=20;spP(b.x+14,b.y+18,'#cc3300',8);if(b.hp<=0&&!b.dead){b.dead=true;P.kills++;score+=100*(curLvl+1);}}
function hitBoss(b,d){b.hp-=d;b.hurt=20;spP(b.x+b.w/2,b.y+b.h/2,'#ff4400',12);if(b.hp<=0&&!b.dead){b.dead=true;P.kills+=5;score+=2000*(curLvl+1);boom(b.x+b.w/2,b.y+b.h/2,120);}}

// ── Ninjas (with slingshot mechanic) ─────────────────────
function mkNinja(x,y){
  return {x,y,w:10,h:14,vx:0,vy:0,onG:false,dir:1,
    hp:9999,maxHp:9999,inv:0,dead:false,
    attackT:Math.floor(Math.random()*30)+40,
    netT:Math.floor(Math.random()*180)+120,  // spider web shot
    webAnimT:0,  // web shooting animation
    flipRot:0,
    gliding:false,
    jumpT:Math.floor(Math.random()*60),
    // Slingshot mechanic
    slingshotT:Math.floor(Math.random()*600)+400, // when to slingshot another ninja
    slingshotAnim:0, // animation timer
    slingshotTarget:-1, // index of target ninja
    launched:false,  // this ninja was just launched
    launchedSlowMo:0, // slow-mo timer after being launched
    launchedTarget:null, // target to shoot at after launch
    };
}
function spawnNinja(x,y){ninjas.push(mkNinja(x,y));}

function updNinjas(){
  ninjas.forEach(n=>{n.dead=false;n.hp=9999;});
  ninjas.forEach((n,nidx)=>{
    if(n.inv>0)n.inv--;

    // If launched, we're in slow-mo attack mode
    if(n.launched){
      n.launchedSlowMo--;
      // Shoot web at target in slow-mo
      if(n.launchedSlowMo>0&&n.launchedSlowMo%18===0&&n.launchedTarget&&!n.launchedTarget.dead){
        nets.push({x:n.x+n.w/2,y:n.y+n.h/2,vx:0,vy:0,life:300,hit:false,deployT:0,target:null,homing:true,homingTarget:n.launchedTarget,fromNinja:true,isWeb:true});
        sndWebShot();
        spP(n.x+n.w/2,n.y+n.h/2,'#aaeeff',6);
      }
      if(n.launchedSlowMo<=0)n.launched=false;
      // Still move normally while launched
    }

    // Slingshot: randomly launch another ninja at enemy
    if(n.onG&&ninjas.length>1&&n.slingshotT>0){
      n.slingshotT--;
      if(n.slingshotT<=0){
        // Find closest enemy
        let target=null,td=Infinity;
        [...bears.filter(b=>!b.dead),...tanks.filter(t=>!t.dead)].forEach(e=>{
          const d=Math.hypot(e.x+e.w/2-(n.x+n.w/2),e.y+e.h/2-(n.y+n.h/2));
          if(d<td&&d<400){td=d;target=e;}
        });
        if(gooseBoss&&!gooseBoss.dead){const d=Math.hypot(gooseBoss.x+gooseBoss.w/2-(n.x+n.w/2),gooseBoss.y+gooseBoss.h/2-(n.y+n.h/2));if(d<td){td=d;target=gooseBoss;}}
        if(karateBear&&!karateBear.dead){const d=Math.hypot(karateBear.x+karateBear.w/2-(n.x+n.w/2),karateBear.y+karateBear.h/2-(n.y+n.h/2));if(d<td){td=d;target=karateBear;}}

        // Find another ninja to launch
        const otherNinjas=ninjas.filter((_,i)=>i!==nidx&&!ninjas[i].launched);
        if(otherNinjas.length>0&&target){
          const launchee=otherNinjas[Math.floor(Math.random()*otherNinjas.length)];
          // Slingshot animation
          n.slingshotAnim=30;
          // Launch toward target
          const ang=Math.atan2((target.y+target.h/2)-(launchee.y+launchee.h/2),(target.x+target.w/2)-(launchee.x+launchee.w/2));
          launchee.vx=Math.cos(ang)*18;
          launchee.vy=Math.sin(ang)*18-5;
          launchee.launched=true;
          launchee.launchedSlowMo=90;
          launchee.launchedTarget=target;
          sndSlingshot();
          spP(n.x+n.w/2,n.y,'#ffcc00',14);
        }
        n.slingshotT=400+Math.floor(Math.random()*400);
      }
    }
    if(n.slingshotAnim>0)n.slingshotAnim--;

    const frontOffset=P.dir*(30+nidx*18);
    const targetX=P.x+frontOffset;
    const dx=targetX-(n.x+n.w/2);
    const absDx=Math.abs(dx);

    let target=null,td=Infinity;
    [...bears.filter(b=>!b.dead),...tanks.filter(t=>!t.dead)].forEach(e=>{
      const d=Math.hypot(e.x+e.w/2-(n.x+n.w/2),e.y+e.h/2-(n.y+n.h/2));
      if(d<td&&d<300){td=d;target=e;}
    });
    if(gooseBoss&&!gooseBoss.dead){const d=Math.hypot(gooseBoss.x+gooseBoss.w/2-(n.x+n.w/2),gooseBoss.y+gooseBoss.h/2-(n.y+n.h/2));if(d<td&&d<350){td=d;target=gooseBoss;}}
    if(karateBear&&!karateBear.dead){const d=Math.hypot(karateBear.x+karateBear.w/2-(n.x+n.w/2),karateBear.y+karateBear.h/2-(n.y+n.h/2));if(d<td&&d<350){td=d;target=karateBear;}}

    if(target&&td<250&&!n.launched){
      const edx=(target.x+target.w/2)-(n.x+n.w/2);
      n.dir=edx>0?1:-1;
      n.vx=n.dir*4.5;
      n.jumpT--;
      if(n.jumpT<=0&&n.onG){n.vy=JF*0.9;n.jumpT=40+Math.floor(Math.random()*40);}
      n.attackT--;
      if(n.attackT<=0&&td<50){
        n.attackT=20;
        spP(n.x+n.w/2,n.y+n.h/2,'#00ffcc',10);
        if(target===gooseBoss||target===karateBear)hitBoss(target,18);
        else if(target.maxHp>150)hitTank(target,12);
        else hBear(target,22);
      }
      // Web net shot (spider web from slingshot)
      n.netT--;
      if(n.netT<=0&&td>30&&td<280){
        n.netT=150+Math.floor(Math.random()*120);
        n.webAnimT=20;
        // Web shoots in a spread pattern
        for(let wi=0;wi<3;wi++){
          const ang=Math.atan2((target.y+target.h/2)-(n.y+n.h/3),(target.x+target.w/2)-(n.x+n.w/2))+(wi-1)*0.25;
          nets.push({x:n.x+n.w/2,y:n.y+n.h/3,vx:Math.cos(ang)*11,vy:Math.sin(ang)*11-2,life:300,hit:false,deployT:0,target:null,homing:false,fromNinja:true,isWeb:true,webSpin:Math.random()*Math.PI*2});
        }
        sndWebShot();
        spP(n.x+n.w/2,n.y+n.h/3,'#aaeeff',8);
      }
    } else if(!n.launched){
      n.dir=P.dir;
      if(absDx>8)n.vx=(dx>0?1:-1)*Math.min(5,absDx*0.15);
      else n.vx=0;
      n.attackT=Math.max(0,n.attackT-1);
      n.netT=Math.max(0,n.netT-1);
    }
    if(n.webAnimT>0)n.webAnimT--;

    if(keys['Tab']&&!n.onG)n.gliding=true;
    else if(n.onG)n.gliding=false;
    if(n.gliding){n.vy=Math.min(n.vy,0.8);}

    if(!n.onG&&!n.gliding){n.flipRot+=0.3;}
    else{n.flipRot=0;}

    moveE(n);
    if(n.onG&&P.y<n.y-20&&n.jumpT<=0&&!n.launched){n.vy=JF*0.85;n.jumpT=50;n.gliding=false;}
  });
}

function drawNinja(n,nidx){
  const sx=n.x-camX,sy=n.y-camY;
  if(sx<-60||sx>VW+60||sy<-60||sy>VH+60)return;
  cx.save();cx.translate(sx+n.w/2,sy+n.h/2);
  if(n.dir<0)cx.scale(-1,1);
  if(!n.onG&&!n.gliding)cx.rotate(n.flipRot);

  // Slingshot animation: show elastic band
  if(n.slingshotAnim>0){
    const t=n.slingshotAnim/30;
    // Draw slingshot Y-shape
    cx.strokeStyle=`rgba(120,80,20,${t})`;cx.lineWidth=3;
    cx.beginPath();cx.moveTo(-2,0);cx.lineTo(-12,-16);cx.stroke();
    cx.beginPath();cx.moveTo(-2,0);cx.lineTo(12,-16);cx.stroke();
    // Elastic band with stretch
    cx.strokeStyle=`rgba(180,80,0,${t})`;cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(-12,-16);cx.quadraticCurveTo(-2,-20+t*14,12,-16);cx.stroke();
  }

  // Launched glow
  if(n.launched){
    const pulse=0.6+0.4*Math.sin(Date.now()/60);
    cx.shadowBlur=12;cx.shadowColor=`rgba(255,200,0,${pulse})`;
  }

  if(n.gliding){
    cx.fillStyle='rgba(100,180,255,0.7)';
    cx.beginPath();cx.moveTo(-5,-4);cx.lineTo(-20,-1);cx.lineTo(-18,5);cx.lineTo(-5,2);cx.closePath();cx.fill();
  }

  // Web shooting animation
  if(n.webAnimT>0){
    const t=n.webAnimT/20;
    cx.strokeStyle=`rgba(150,230,255,${t})`;cx.lineWidth=1;
    for(let wi=0;wi<5;wi++){
      const ang=wi*0.3-0.6;
      cx.beginPath();cx.moveTo(5,0);cx.lineTo(5+Math.cos(ang)*20*t,Math.sin(ang)*12*t);cx.stroke();
    }
  }

  cx.fillStyle='#111122';cx.fillRect(-4,-6,8,10);
  cx.fillStyle='#cc2200';cx.fillRect(-3,-3,6,3);
  cx.fillStyle='#222244';cx.fillRect(-3,-14,6,9);
  cx.fillStyle='#fff';cx.fillRect(0,-12,3,2);
  cx.fillStyle='#111122';cx.fillRect(-3,4,2,5);cx.fillRect(1,4,2,5);
  // Slingshot weapon on back
  cx.fillStyle='#5a3010';cx.fillRect(-6,-8,3,6);cx.fillRect(-9,-12,6,3);cx.fillRect(-9,-8,3,3);
  cx.fillStyle='#aaddff';cx.fillRect(3,-5,8,2);
  cx.shadowBlur=0;
  cx.restore();
}

function spawnKarateBear(x,y,lvl=0){

}
function updKarateBear(){

  if(dist>150)karateBear.vx=karateBear.dir*3.5*spd;
  else if(dist<80)karateBear.vx=-karateBear.dir*2*spd;
  else karateBear.vx=karateBear.dir*1*spd;
  karateBear.leapT-=spd;
  if(karateBear.leapT<=0&&karateBear.onG){karateBear.leapT=120+Math.floor(Math.random()*80);karateBear.vy=JF*1.1;karateBear.vx=karateBear.dir*8;spP(karateBear.x+karateBear.w/2,karateBear.y+karateBear.h,'#4a2e12',20);}
  if(slowMo){const sv=karateBear.vx;karateBear.vx*=spd;moveE(karateBear);karateBear.vx=sv;}else moveE(karateBear);
  karateBear.chopT-=spd;

    if(olap(reach,{x:P.x,y:P.y,w:P.w,h:P.h}))hPlayer(20);
    spP(karateBear.x+(karateBear.dir>0?karateBear.w+20:karateBear.x-20),karateBear.y+karateBear.h*.3,'#cc44ff',15);
  }
  if(karateBear.punchAnim>0)karateBear.punchAnim--;
  karateBear.kickT-=spd;
  if(karateBear.kickT<=0&&dist<100){
    karateBear.kickT=55;karateBear.kickAnim=20;
    const reach={x:karateBear.x+(karateBear.dir>0?karateBear.w:-T*2.5),y:karateBear.y+karateBear.h*.4,w:T*2.5,h:karateBear.h*.5};
    if(olap(reach,{x:P.x,y:P.y,w:P.w,h:P.h})){hPlayer(18);P.vx+=karateBear.dir*12;P.vy-=8;}
  }
  if(karateBear.kickAnim>0)karateBear.kickAnim--;
  if(olap({x:P.x,y:P.y,w:P.w,h:P.h},{x:karateBear.x,y:karateBear.y,w:karateBear.w,h:karateBear.h}))hPlayer(4);
}
function drawKarateBear(){

  else{cx.fillStyle='#6B4423';cx.fillRect(34,-140,14,60);cx.fillRect(-48,-140,14,60);}
  cx.fillStyle='#6B4423';cx.beginPath();cx.ellipse(0,-175,34,30,0,0,Math.PI*2);cx.fill();

  cx.fillStyle='#ff0000';cx.fillRect(-30,-188,60,12);
  cx.fillStyle='#ff2200';cx.beginPath();cx.arc(-12,-178,7,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(12,-178,7,0,Math.PI*2);cx.fill();
  cx.fillStyle='#000';cx.beginPath();cx.arc(-10,-178,4,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(14,-178,4,0,Math.PI*2);cx.fill();
  cx.fillStyle='#c07840';cx.beginPath();cx.ellipse(0,-168,14,10,0,0,Math.PI*2);cx.fill();
  cx.restore();
  const pct=karateBear.hp/karateBear.maxHp;
  cx.fillStyle='#400';cx.fillRect(sx-4,sy-18,w+8,12);
  cx.fillStyle=pct>.5?'#0c0':pct>.25?'#fa0':'#f00';cx.fillRect(sx-4,sy-18,(w+8)*pct,12);
  cx.strokeStyle='#fff';cx.lineWidth=1;cx.strokeRect(sx-4,sy-18,w+8,12);

// ── Bears ─────────────────────────────────────────────────
function mkBear(x,y,lvl=0,flag=false){
  const bonus=lvl*6;
  return {x,y,w:28,h:36,fh:36,vx:0,vy:0,onG:false,dir:-1,
    hp:60+bonus,maxHp:60+bonus,hurt:0,poisoned:0,dead:false,shocked:0,
    shotT:8+Math.floor(Math.random()*6),barrelRot:0,
    flameT:0,flameCD:Math.floor(Math.random()*180)+120,
    crouching:false,crouchT:0,
    hasLava:Math.random()<0.4,lavaT:180+Math.random()*120,
    flag,flagAnim:0,
    charging:false,chargeT:0,chargeSpeed:0,
    biteT:0,biteCD:0,
    spotted:false,
    mgSndT:0}; // machine gun sound per bear
}
function spawnBear(x,y,lvl=0,flag=false){bears.push(mkBear(x,y,lvl,flag));}
function initBears(n,cols,surf,lvl=0){
  bears=[];
  for(let i=0;i<n;i++)spawnBear((20+Math.floor(Math.random()*(cols-40)))*T,(surf-3)*T,lvl);
}

function inBossZone(){
  if(gooseBoss&&!gooseBoss.dead&&P.x>gooseBoss.territory)return true;
  if(karateBear&&!karateBear.dead&&P.x>karateBear.territory&&P.x<(karateBear.territory+800))return true;
  return false;
}

// ── Tanks ─────────────────────────────────────────────────
function mkTank(x,y,lvl=0){
  const bonus=lvl*8;
  return {x,y,w:96,h:52,vx:0,vy:0,onG:false,hp:200+bonus,maxHp:200+bonus,dead:false,hurt:0,dir:1,moveT:0,
    shootT:180,  // shoots every 3 seconds (180 frames at 60fps)
    barrelRot:0,lvl,cmdShotT:80+Math.floor(Math.random()*40),escort:[]};
}
function spawnTank(x,y,lvl=0){
  if(tanks.length>=3)return;
  if(tanks.some(tk=>!tk.dead&&tk.x-camX>-200&&tk.x-camX<VW+200))return;
  const tk=mkTank(x,y,lvl);
  tk.escort=[mkBear(x-40,y-4,lvl,false),mkBear(x-70,y-4,lvl,false),mkBear(x-100,y-4,lvl,true)];
  tanks.push(tk);
}
function hitTank(tk,d){tk.hp-=d;tk.hurt=20;spP(tk.x+tk.w/2,tk.y+tk.h/2,'#ff8800',10);if(tk.hp<=0&&!tk.dead)destroyTank(tk);}
function destroyTank(tk){
  tk.dead=true;score+=500*(curLvl+1);P.kills+=1;
  boom(tk.x+tk.w/2,tk.y+tk.h/2,80);
  for(let i=0;i<4;i++){const b=mkBear(tk.x+tk.w/2+(Math.random()-.5)*60,tk.y,tk.lvl,i===3);b.vy=-8-Math.random()*4;b.vx=(Math.random()-.5)*6;bears.push(b);}
}

function updBearCommon(b,lvl=0){
  if(b.dead)return;
  const spd=slowMo?0.15:1;

  const dist2P=Math.hypot(b.x+b.w/2-(P.x+P.w/2),b.y+b.h/2-(P.y+P.h/2));
  if(!b.spotted&&dist2P<280){b.spotted=true;if(!bearSpottedSnd){bearSpottedSnd=true;sndAlarm();setTimeout(()=>bearSpottedSnd=false,3000);}}

  if(b.shocked>0){
    b.shocked-=spd;b.vx*=0.8;
    if(Math.floor(b.shocked)%6===0)spP(b.x+b.w/2,b.y+b.h/2,'#00ffff',5);
    if(b.shocked<=0){b.dead=true;P.kills++;score+=100*(curLvl+1);spP(b.x+b.w/2,b.y+b.h/2,'#00ffff',30);}
    if(slowMo){const sv=b.vx;b.vx*=spd;moveE(b);b.vx=sv;}else moveE(b);
    return;
  }
  if(b.poisoned>0){b.poisoned-=spd;if(Math.floor(b.poisoned)%30===0)hBear(b,5);}
  if(b.hurt>0)b.hurt--;
  const dx=(P.x+P.w/2)-(b.x+b.w/2);
  if(!('_escorted' in b))b.dir=dx>0?1:-1;

  if(!b.crouching&&b.onG&&Math.random()<.003){b.crouching=true;b.crouchT=60+Math.random()*80;b.y+=b.fh*.5;b.h=b.fh*.5;}
  if(b.crouching){b.crouchT-=spd;if(b.crouchT<=0){b.y-=b.fh*.5;b.h=b.fh;b.crouching=false;}}

  if(b.biteT>0)b.biteT--;
  if(b.biteCD>0)b.biteCD-=spd;

  const dist=Math.abs(dx);
  if(!b.charging&&b.onG&&dist>150&&Math.random()<0.004){
    b.charging=true;b.chargeT=90+Math.floor(Math.random()*60);b.chargeSpeed=b.dir*5.5;
    spP(b.x+b.w/2,b.y+b.h,'#8B5E3C',10);
  }
  if(b.charging){
    b.chargeT-=spd;b.vx=b.chargeSpeed*spd;
    if(b.chargeT<=0||!b.onG)b.charging=false;
    if(olap({x:b.x,y:b.y,w:b.w,h:b.h},{x:P.x,y:P.y,w:P.w,h:P.h})){
      b.charging=false;
      if(b.biteCD<=0){b.biteT=18;b.biteCD=40;hPlayer(8);spP(P.x+P.w/2,P.y+P.h/2,'#cc2200',12);}
    }
  }

  b.flameCD-=spd;
  if(b.flameCD<=0&&dist<160&&b.onG&&!b.charging){
    b.flameCD=200+Math.floor(Math.random()*100);b.flameT=40;
  }
  if(b.flameT>0){
    b.flameT-=spd;
    if(Math.floor(b.flameT)%6===0){
      const fx=b.x+b.w/2+b.dir*(14+b.flameT*2);
      const fy=b.y+b.h*0.3;
      spP(fx,fy,'#ff4400',3,3);spP(fx,fy,'#ffaa00',2,2);
      sndFlame();
      for(let fi=0;fi<5;fi++){
        const fpx=b.x+b.w/2+b.dir*(20+fi*18),fpy=b.y+b.h*0.3+(Math.random()-.5)*12;
        if(olap({x:fpx-8,y:fpy-8,w:16,h:16},{x:P.x,y:P.y,w:P.w,h:P.h}))hPlayer(1);
      }
    }
  }

  if(b.hasLava&&b.onG&&!b.charging){b.lavaT-=spd;
    if(b.lavaT<=0){b.lavaT=200+Math.random()*100;
      for(let dc=1;dc<=8;dc++){const cc=Math.floor((b.x+b.w/2)/T)+b.dir*dc,fr=Math.floor((b.y+b.h)/T);
        if(cc>=0&&cc<WC&&gB(fr,cc)===AIR){pourLava(cc,fr);spP(cc*T+16,fr*T,'#ff4400',14);break;}}}}

  b.barrelRot+=0.2*spd;
  b.shotT-=spd;
  // Machine gun sound
  if(b.shotT<=0){
    b.shotT=8+Math.floor(Math.random()*6);
    b.mgSndT=(b.mgSndT||0)+1;
    if(!b.charging){
      const ang=Math.atan2((P.y+P.h/2)-(b.y+b.h/2),(P.x+P.w/2)-(b.x+b.w/2))+(Math.random()-.5)*.2;
      projs.push({x:b.x+b.w/2+Math.cos(ang)*18,y:b.y+b.h/2+Math.sin(ang)*18,vx:Math.cos(ang)*11,vy:Math.sin(ang)*11,type:'shell',owner:'bear',life:160,rot:ang});
      // Bratatatata every 6 shots
      if(b.mgSndT%6===0)sndMachineGun();
    }
  }
  if(!b._escorted&&!b.charging){if(Math.abs(dx)>100&&!b.crouching)b.vx=b.dir*1.8*spd;else b.vx*=.85;}
  if(slowMo&&!b.charging){const sv=b.vx;b.vx*=spd;moveE(b);b.vx=sv;}else moveE(b);
  if(!b.charging&&olap({x:b.x,y:b.y,w:b.w,h:b.h},{x:P.x,y:P.y,w:P.w,h:P.h}))hPlayer(1);
  if(b.flag)b.flagAnim=(b.flagAnim||0)+0.07;
}

function updTanks(){
  tanks=tanks.filter(tk=>!tk.dead);
  tanks.forEach(tk=>{
    if(tk.dead)return;
    const spd=slowMo?0.15:1;
    if(tk.hurt>0)tk.hurt--;
    tk.barrelRot+=0.06*spd;
    const dx=(P.x+P.w/2)-(tk.x+tk.w/2);tk.dir=dx>0?1:-1;
    tk.vx=tk.dir*0.8*spd;
    if(slowMo){const sv=tk.vx;tk.vx*=spd;moveE(tk);tk.vx=sv;}else moveE(tk);
    tk.escort=tk.escort.filter(b=>!b.dead);
    tk.escort.forEach(b=>{
      if(b.dead)return;
      const offset=(tk.escort.indexOf(b)+1)*32*tk.dir;const targetX=tk.x+tk.w/2+tk.w/2*tk.dir+offset;
      b.dir=dx>0?1:-1;b.vx=(targetX-b.x)*.08;b.vx=Math.max(-2,Math.min(2,b.vx));
      updBearCommon(b,tk.lvl);
    });
    tk.cmdShotT-=spd;
    if(tk.cmdShotT<=0){tk.cmdShotT=70+Math.floor(Math.random()*50);
      const ang=Math.atan2((P.y+P.h/2)-(tk.y-10),(P.x+P.w/2)-(tk.x+tk.w/2))+(Math.random()-.5)*.15;
      projs.push({x:tk.x+tk.w/2,y:tk.y-8,vx:Math.cos(ang)*10,vy:Math.sin(ang)*10,type:'shell',owner:'bear',life:180,rot:ang});sndShot();}
    // Tank shoots big exploding cannonball every 3 seconds (180 frames)
    tk.shootT-=spd;
    if(tk.shootT<=0){
      tk.shootT=180;
      const ang=Math.atan2((P.y+P.h/2)-(tk.y+tk.h/2),(P.x+P.w/2)-(tk.x+tk.w/2));
      projs.push({x:tk.x+(tk.dir>0?tk.w+4:-4),y:tk.y+tk.h/2-4,vx:Math.cos(ang)*13,vy:Math.sin(ang)*13,type:'cannonball',owner:'bear',life:200,rot:0,bigExplosion:true});
      sndTankShot();
      spP(tk.x+(tk.dir>0?tk.w+20:-20),tk.y+tk.h/2,'#ff6600',20);
    }
    if(olap({x:P.x,y:P.y,w:P.w,h:P.h},{x:tk.x,y:tk.y,w:tk.w,h:tk.h}))hPlayer(2);
  });
}

function updBears(){
  if(inBossZone()){bears=[];tanks=[];return;}
  bearTmr--;
  if(bearTmr<=0){
    bearTmr=260+Math.random()*180;
    const side=Math.random()<.5?camX-T*2:camX+VW+T*2;
    const lvl=gSt==='level'?curLvl:0;
    spawnBear(Math.max(0,Math.min(WC*T-32,side)),P.y-T*3,lvl);
    if(Math.random()<0.25)spawnTank(Math.max(0,Math.min(WC*T-120,side+(Math.random()-.5)*200)),P.y-T*3,lvl);
  }
  bears=bears.filter(b=>!b.dead);
  bears.forEach(b=>updBearCommon(b,gSt==='level'?curLvl:0));
}

// ── Shurikens ─────────────────────────────────────────────
function useShur(i){
  const s=P.shurSlots[i];
  if(s==='empty'){P.shurSlots[i]='loaded';P.shurCount=P.shurSlots.filter(x=>x==='loaded').length;}
  else if(s==='loaded'){
    P.shurSlots[i]='air';P.shurCount=P.shurSlots.filter(x=>x==='loaded').length;
    const ang=P.dir>0?0:Math.PI;
    shurs.push({x:P.x+P.w/2,y:P.y+P.h/2,vx:Math.cos(ang)*13,vy:Math.sin(ang)*13,returning:false,life:300,rot:0,slot:i});
    spP(P.x+P.w/2,P.y+P.h/2,'#ccc',4);
  }
}
function shurRet(s){P.shurSlots[s.slot]='loaded';P.shurCount=P.shurSlots.filter(x=>x==='loaded').length;}

// ── Nets (Spider Webs) ────────────────────────────────────
function updNets(){
  nets=nets.filter(n=>{
    if(n.hit){n.deployT--;
      if(n.target&&!n.target.dead&&n.deployT%8===0)spP(n.target.x+n.target.w/2,n.target.y+n.target.h/2,'#00ffff',4);
      if(n.deployT<=0){if(n.target&&!n.target.dead){n.target.shocked=180;spP(n.target.x+n.target.w/2,n.target.y,'#00ffff',30);}return false;}
      return true;
    }
    if(n.homing&&n.homingTarget&&!n.homingTarget.dead){
      const tgt=n.homingTarget;
      const ddx=(tgt.x+tgt.w/2)-n.x,ddy=(tgt.y+tgt.h/2)-n.y,dd=Math.hypot(ddx,ddy);
      if(dd>0){const sp=14;n.vx+=(ddx/dd*sp-n.vx)*0.2;n.vy+=(ddy/dd*sp-n.vy)*0.2;}
    }else{n.vy+=GRAV*.3;}
    n.x+=n.vx;n.y+=n.vy;n.life--;
    if(n.webSpin!==undefined)n.webSpin+=0.15;
    if(!n.homing&&solid(Math.floor(n.y/T),Math.floor(n.x/T)))return false;
    const targets=[...bears.filter(b=>!b.dead),...tanks.filter(t=>!t.dead)];
    if(gooseBoss&&!gooseBoss.dead)targets.push(gooseBoss);
    if(karateBear&&!karateBear.dead)targets.push(karateBear);
    for(const tgt of targets){
      if(olap({x:n.x-10,y:n.y-10,w:20,h:20},{x:tgt.x,y:tgt.y,w:tgt.w,h:tgt.h})){
        n.hit=true;n.deployT=28;n.target=tgt;n.x=tgt.x+tgt.w/2;n.y=tgt.y+tgt.h/2;
        tgt.vx*=.1;spP(tgt.x+tgt.w/2,tgt.y,'#aaeeff',14);return true;
      }
    }
    return n.life>0&&n.x>0&&n.x<WC*T&&n.y>0&&n.y<WR*T;
  });
}

// ── Projectiles ───────────────────────────────────────────
function updProjs(){
  projs=projs.filter(p=>{
    const mv=(slowMo&&p.owner!=='player')?0.15:1;
    p.x+=p.vx*mv;p.y+=p.vy*mv;p.rot+=0.3;p.life--;
    if(p.type==='grenade'||p.type==='cannonball')p.vy+=GRAV*.5*mv;
    const br=Math.floor(p.y/T),bc=Math.floor(p.x/T);
    if(solid(br,bc)||gB(br,bc)===HEALTH){
      if(p.type==='explode'||p.type==='grenade')boom(p.x,p.y);
      else if(p.type==='cannonball')boom(p.x,p.y,p.bigExplosion?120:72);
      else spP(p.x,p.y,'#ffaa44',4);
      return false;
    }
    if(p.owner==='player'){
      for(const b of bears){if(b.dead)continue;if(olap({x:p.x-4,y:p.y-4,w:8,h:8},{x:b.x,y:b.y,w:b.w,h:b.h})){
        if(p.type==='explode')boom(p.x,p.y,80);else if(p.type==='grenade')boom(p.x,p.y,64);else{hBear(b,p.type==='poison'?15:20);if(p.type==='poison')b.poisoned=180;}return false;}}
      for(const tk of tanks){if(tk.dead)continue;if(olap({x:p.x-4,y:p.y-4,w:8,h:8},{x:tk.x,y:tk.y,w:tk.w,h:tk.h})){
        if(p.type==='explode')boom(p.x,p.y,80);else if(p.type==='grenade')boom(p.x,p.y,64);else hitTank(tk,p.type==='poison'?12:18);return false;}}
      if(gooseBoss&&!gooseBoss.dead&&olap({x:p.x-4,y:p.y-4,w:8,h:8},{x:gooseBoss.x,y:gooseBoss.y,w:gooseBoss.w,h:gooseBoss.h})){hitBoss(gooseBoss,p.type==='explode'?40:p.type==='poison'?15:20);return false;}
      if(karateBear&&!karateBear.dead&&olap({x:p.x-4,y:p.y-4,w:8,h:8},{x:karateBear.x,y:karateBear.y,w:karateBear.w,h:karateBear.h})){hitBoss(karateBear,p.type==='explode'?40:p.type==='poison'?15:20);return false;}
    }else if(p.owner==='bear'||p.owner==='boss'){
      if(olap({x:p.x-4,y:p.y-4,w:8,h:8},{x:P.x,y:P.y,w:P.w,h:P.h})){hPlayer(p.type==='cannonball'?25:p.type==='feather'?12:10);return false;}
    }
    if(p.life<=0){if(p.type==='grenade')boom(p.x,p.y,64);if(p.type==='cannonball')boom(p.x,p.y,p.bigExplosion?120:72);return false;}
    return p.x>0&&p.x<WC*T&&p.y>0&&p.y<WR*T;
  });
  shurs.forEach(s=>{
    s.rot+=.45;s.life--;
    if(!s.returning){
      s.x+=s.vx;s.y+=s.vy;
      if(solid(Math.floor(s.y/T),Math.floor(s.x/T))||s.life<240)s.returning=true;
      for(const b of bears)if(!b.dead&&olap({x:s.x-6,y:s.y-6,w:12,h:12},{x:b.x,y:b.y,w:b.w,h:b.h})){hBear(b,18);s.returning=true;}
      for(const tk of tanks)if(!tk.dead&&olap({x:s.x-6,y:s.y-6,w:12,h:12},{x:tk.x,y:tk.y,w:tk.w,h:tk.h})){hitTank(tk,12);s.returning=true;}
      if(gooseBoss&&!gooseBoss.dead&&olap({x:s.x-6,y:s.y-6,w:12,h:12},{x:gooseBoss.x,y:gooseBoss.y,w:gooseBoss.w,h:gooseBoss.h})){hitBoss(gooseBoss,14);s.returning=true;}
      if(karateBear&&!karateBear.dead&&olap({x:s.x-6,y:s.y-6,w:12,h:12},{x:karateBear.x,y:karateBear.y,w:karateBear.w,h:karateBear.h})){hitBoss(karateBear,14);s.returning=true;}
    }else{
      const ddx=(P.x+P.w/2)-s.x,ddy=(P.y+P.h/2)-s.y,dd=Math.hypot(ddx,ddy);
      if(dd<20){s.life=0;shurRet(s);}else{s.vx=ddx/dd*10;s.vy=ddy/dd*10;s.x+=s.vx;s.y+=s.vy;}
    }
  });
  shurs=shurs.filter(s=>s.life>0);
}

// ── Portal / Egg ──────────────────────────────────────────
function chkPortal(){
  if(gSt!=='lobby'||!jp['ArrowUp'])return;
  for(let i=0;i<LEVELS.length;i++){
    if(i>0&&!cleared[i-1])continue;
    const px=PCOLS[i]*T,py=(LSURF-3)*T;
    if(olap({x:P.x,y:P.y,w:P.w,h:P.h},{x:px,y:py,w:T*2,h:T*3})){enterLvl(i);return;}
  }
}
function chkEgg(){
  if(gSt!=='level'||!egg||egg.collected)return;
  if(olap({x:P.x,y:P.y,w:P.w,h:P.h},{x:egg.x-egg.w/2,y:egg.y-egg.h/2,w:egg.w,h:egg.h})){
    egg.collected=true;score+=500*(curLvl+1);
    spP(egg.x,egg.y,'#ffd700',40);cleared[curLvl]=true;
    P.hp=P.maxHp;spP(P.x+P.w/2,P.y+P.h/2,'#00ff88',30);
    spawnNinja(P.x+P.dir*(30+ninjas.length*16),P.y);
    bombActive=false;
    document.getElementById('timerBar').style.display='none';
    document.getElementById('timerHud').style.display='none';
    sndCollect();sndWin();saveProgress();
    setTimeout(enterLobby,1500);
  }
}

}

// ── Player Update ─────────────────────────────────────────
function updPlayer(){
  const wantCrouch=!!keys['ControlLeft']||!!keys['ControlRight'];
  if(P.onG&&wantCrouch&&!P.crouching){P.crouching=true;P.h=Math.floor(SH/2);P.y+=SH-P.h;}
  if(P.crouching&&(!wantCrouch||!P.onG)){P.y-=(SH-P.h);P.h=SH;P.crouching=false;}

  const mvL=!!keys['ArrowLeft'],mvR=!!keys['ArrowRight'];
  if(P.crouching){
    if(mvL){P.vx=-2;P.dir=-1;P.movDir=-1;}else if(mvR){P.vx=2;P.dir=1;P.movDir=1;}else{P.vx=0;P.movDir=0;}
  }else{
    if(mvL){P.vx=-4;P.dir=-1;P.movDir=-1;}else if(mvR){P.vx=4;P.dir=1;P.movDir=1;}else{P.vx=0;P.movDir=0;}
  }

  if(P.onG)P.coy=8;else if(P.coy>0)P.coy--;
  if(jp['Space']&&P.coy>0&&!P.crouching){P.vy=JF;P.coy=0;P.onG=false;P.jumped=true;P.landMined=false;P.wasGliding=false;sndJump();}

  const wasGl=P.gliding;
  if(keys['Tab']&&!P.onG&&!P.crouching)P.gliding=true;
  else if(P.onG){if(P.gliding)P.wasGliding=true;P.gliding=false;}
  if(P.gliding){P.vy=Math.min(P.vy,.8);P.vx=P.dir*5;}

  if(!P.onG&&!P.gliding){P.flipRot+=0.22;}
  else{P.flipRot=0;}

  if(P.vy<-1){
    const hr=Math.floor((P.y+P.vy)/T),mc=Math.floor((P.x+P.w/2)/T);
    if(solid(hr,mc)){const tb=gB(hr,mc);
      if(platRows.has(hr)){P.y=hr*T-P.h;P.vy=0;P.onG=true;}
      else{sB(hr,mc,AIR);spP(mc*T+16,hr*T+16,TCLR[tb]||'#888',8);sndMine();}}}

  const wasOnG=P.onG;
  moveE(P);

  if(!P.onG&&P.jumped&&P.movDir!==0&&P.vy>-4&&P.vy<10){
    const wc2=P.movDir>0?Math.floor((P.x+P.w)/T):Math.floor((P.x-1)/T);
    const rT=Math.floor(P.y/T),rB=Math.floor((P.y+P.h-1)/T);
    for(let r=rT;r<=rB;r++){
      if(solid(r,wc2)&&!solid(r-1,wc2)){
        const ty=r*T-P.h,pull=P.y-ty;
        if(pull>0&&pull<=T*1.5){P.y=ty;P.x+=P.movDir*(T*.4);P.vy=0;P.vx=0;P.onG=true;P.jumped=false;P.gliding=false;spP(P.x+P.w/2,P.y+P.h,'#88aaff',5);break;}
      }
    }
  }

  if(!wasOnG&&P.onG){
    if(P.jumped&&!P.landMined&&!wasGl&&!P.wasGliding){
      P.landMined=true;
      const fr=Math.floor((P.y+P.h)/T),mc=Math.floor((P.x+P.w/2)/T);
      const tb=gB(fr,mc);
      if(tb!==AIR&&tb!==BEDROCK&&tb!==HEALTH&&tb!==LAVA){sB(fr,mc,AIR);spP(mc*T+16,fr*T+16,TCLR[tb]||'#888',8);sndMine();}
    }
    P.jumped=false;P.wasGliding=false;
  }
  if(!P.onG)P.landMined=false;

  chkPortal();chkEgg();

  // Portal sound cue
  if(gSt==='lobby'){
    let nearPortal=false;
    for(let i=0;i<LEVELS.length;i++){
      if(i>0&&!cleared[i-1])continue;
      const px=PCOLS[i]*T,py=(LSURF-3)*T;
      if(Math.abs(P.x-(px+T))<80&&Math.abs(P.y-py)<100){nearPortal=true;break;}
    }
    portalSndTmr--;
    if(nearPortal&&portalSndTmr<=0){portalSndTmr=90;sndPortal();}
  }

  {
    const feetR=Math.floor((P.y+P.h)/T),midR=Math.floor((P.y+P.h/2)/T),midC=Math.floor((P.x+P.w/2)/T);
    const inLava=gB(feetR,midC)===LAVA||gB(midR,midC)===LAVA;
    const belowSurf=(feetR>surfRow)||(midR>=surfRow&&gB(midR,midC)!==AIR&&gB(midR,midC)!==LAVA);
    if(belowSurf||inLava){subTmr++;if(subTmr>=12){subTmr=0;P.hp=Math.max(0,P.hp-1);}if(inLava)spP(P.x+P.w/2,P.y+P.h/2,'#ff5500',2);}
    else subTmr=0;
  }
  if(P.inv>0)P.inv--;

  if(jp['Enter']){
    P.sword=20;
    const fc=P.dir>0?Math.floor((P.x+P.w+1)/T):Math.floor((P.x-1)/T);
    const fm=Math.floor((P.y+P.h/2)/T);
    const tb=gB(fm,fc);
    if(tb===HEALTH){sB(fm,fc,AIR);P.hp=P.maxHp;spP(fc*T+16,fm*T+16,'#00ff66',18);sushiAnim={on:true,t:45,x:P.x,y:P.y};sndCollect();}
    else if(tb!==AIR&&tb!==BEDROCK&&tb!==LAVA){sB(fm,fc,AIR);spP(fc*T+16,fm*T+16,TCLR[tb]||'#888',6);}
    const reach=P.dir>0?{x:P.x+P.w,y:P.y,w:T+4,h:P.h}:{x:P.x-T-4,y:P.y,w:T+4,h:P.h};
    bears.forEach(b=>{if(!b.dead&&olap(reach,{x:b.x,y:b.y,w:b.w,h:b.h}))hBear(b,30);});
    tanks.forEach(tk=>{if(!tk.dead&&olap(reach,{x:tk.x,y:tk.y,w:tk.w,h:tk.h}))hitTank(tk,20);});
    if(gooseBoss&&!gooseBoss.dead&&olap(reach,{x:gooseBoss.x,y:gooseBoss.y,w:gooseBoss.w,h:gooseBoss.h}))hitBoss(gooseBoss,25);
    if(karateBear&&!karateBear.dead&&olap(reach,{x:karateBear.x,y:karateBear.y,w:karateBear.w,h:karateBear.h}))hitBoss(karateBear,25);
  }
  if(P.sword>0)P.sword--;

  if(jp['Backspace']){P.nunchuck=25;const cx2=P.x+P.w/2,cy2=P.y+P.h/2;bears.forEach(b=>{if(!b.dead&&Math.hypot(b.x+b.w/2-cx2,b.y+b.h/2-cy2)<52)hBear(b,25);});}
  if(P.nunchuck>0)P.nunchuck--;

  {let d=false;for(const k of SPIN_K)if(jp[k]){d=true;break;}
  if(d){P.spin=28;const cx2=P.x+P.w/2,cy2=P.y+P.h/2;
    bears.forEach(b=>{if(!b.dead){const dd=Math.hypot(b.x+b.w/2-cx2,b.y+b.h/2-cy2);if(dd<60){hBear(b,22);b.vx+=(b.x+b.w/2-cx2)/dd*8;b.vy-=5;}}});
    if(gooseBoss&&!gooseBoss.dead&&Math.hypot(gooseBoss.x+gooseBoss.w/2-cx2,gooseBoss.y+gooseBoss.h/2-cy2)<80)hitBoss(gooseBoss,18);
    if(karateBear&&!karateBear.dead&&Math.hypot(karateBear.x+karateBear.w/2-cx2,karateBear.y+karateBear.h/2-cy2)<80)hitBoss(karateBear,18);
    spP(cx2,cy2,'#ff8800',12);}
  if(P.spin>0)P.spin--;}

  {let d=false;for(const k of JAB_K)if(jp[k]){d=true;break;}
  if(d){P.jab=18;const reach=P.dir>0?{x:P.x+P.w,y:P.y+P.h/2,w:T+8,h:P.h/2+4}:{x:P.x-T-8,y:P.y+P.h/2,w:T+8,h:P.h/2+4};
    bears.forEach(b=>{if(!b.dead&&olap(reach,{x:b.x,y:b.y,w:b.w,h:b.h})){hBear(b,18);b.vx+=P.dir*6;}});
    if(gooseBoss&&!gooseBoss.dead&&olap(reach,{x:gooseBoss.x,y:gooseBoss.y,w:gooseBoss.w,h:gooseBoss.h}))hitBoss(gooseBoss,15);
    if(karateBear&&!karateBear.dead&&olap(reach,{x:karateBear.x,y:karateBear.y,w:karateBear.w,h:karateBear.h}))hitBoss(karateBear,15);
    spP(P.x+(P.dir>0?P.w+10:-10),P.y+P.h*.7,'#ffaa33',8);}
  if(P.jab>0)P.jab--;}

  {let d=false;for(const k of CHOP_K)if(jp[k]){d=true;break;}
  if(d){P.chop=22;const reach=P.dir>0?{x:P.x+P.w-4,y:P.y-4,w:T+4,h:P.h+4}:{x:P.x-T-4,y:P.y-4,w:T+4,h:P.h+4};
    bears.forEach(b=>{if(!b.dead&&olap(reach,{x:b.x,y:b.y,w:b.w,h:b.h})){hBear(b,24);b.vy-=4;}});
    if(gooseBoss&&!gooseBoss.dead&&olap(reach,{x:gooseBoss.x,y:gooseBoss.y,w:gooseBoss.w,h:gooseBoss.h}))hitBoss(gooseBoss,20);
    if(karateBear&&!karateBear.dead&&olap(reach,{x:karateBear.x,y:karateBear.y,w:karateBear.w,h:karateBear.h}))hitBoss(karateBear,20);
    spP(P.x+(P.dir>0?P.w+8:-8),P.y+4,'#cc44ff',10);}
  if(P.chop>0)P.chop--;}

  if(keys['ShiftRight'])aiming=true;
  else if(aiming){
    const tp=ANAMES[arrowT],ox=P.x+P.w/2+Math.cos(aimAng)*15,oy=P.y+P.h/2+Math.sin(aimAng)*15;
    projs.push({x:ox,y:oy,vx:Math.cos(aimAng)*14,vy:Math.sin(aimAng)*14,type:tp,owner:'player',life:220,rot:0});
    spP(ox,oy,tp==='explode'?'#ff4400':tp==='poison'?'#44ff44':'#ffee88',4);aiming=false;sndShot();
  }
  slowMo=aiming&&!P.onG;

  if(jp['ShiftLeft']){const a=P.dir>0?-.5:Math.PI+.5;projs.push({x:P.x+P.w/2,y:P.y+P.h/3,vx:Math.cos(a)*10,vy:Math.sin(a)*10-4,type:'grenade',owner:'player',life:220,rot:0});sndShot();}

  const DK=['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0'];
  for(let i=0;i<10;i++)if(jp[DK[i]])useShur(i);

  if(P.y>WR*T)P.hp=0;
  if(egg&&!egg.collected)egg.bobT+=.05;
  if(sushiAnim.on){sushiAnim.t--;if(sushiAnim.t<=0)sushiAnim.on=false;}
}

function updCam(){camX=Math.max(0,Math.min(WC*T-VW,P.x+P.w/2-VW/2));camY=Math.max(0,Math.min(WR*T-VH,P.y+P.h/2-VH/2));}

  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--;return p.life>0;});
  fxs=fxs.filter(e=>{e.life--;e.r+=5;return e.life>0;});
}

  if(introLineIdx<introLines.length&&!introChoiceVisible){

function handleIntroInput(){
  if(introState==='stabbed')return;
  if(introChoiceVisible){
    if(jp['KeyY']){
      // Yes - start the game
      const saved=loadProgress();
      if(saved&&saved.ninjaCount>0){for(let i=0;i<saved.ninjaCount;i++)ninjas.push(mkNinja(100+i*20,100));}

      // No - Gramps stabs you
      introState='stabbed';introStabbedAnim=0;

}

function drawWorld(){
  const c0=Math.max(0,Math.floor(camX/T)-1),c1=Math.min(WC-1,Math.ceil((camX+VW)/T)+1);
  const r0=Math.max(0,Math.floor(camY/T)-1),r1=Math.min(WR-1,Math.ceil((camY+VH)/T)+1);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){

      cx.fillStyle='rgba(100,255,140,.7)';cx.fillRect(sx+2,sy+2,T-4,T-4);

      cx.shadowBlur=8+pulse*6;cx.shadowColor='#00ff66';cx.strokeStyle='rgba(80,255,120,.8)';cx.lineWidth=1.5;cx.strokeRect(sx+1,sy+1,T-2,T-2);cx.shadowBlur=0;

    cx.fillStyle='#b8900a';for(let ai=0;ai<5;ai++){const af=ai/4,ax=4+((-8)-4)*af,ay=6+(18-6)*af+Math.sin(af*Math.PI)*2;cx.fillRect(ax-2,ay-2,5,4);}

}

  cx.fillStyle='#222';cx.fillRect(-6,th-14,tw+12,14);cx.fillStyle='#333';const treadOff=(Date.now()/80*dir|0)%12;for(let ti=0;ti<10;ti++){const tx2=((ti*12+treadOff)%(tw+24))-6;cx.fillRect(tx2,th-14,8,14);}

  cx.save();cx.translate(tw/2,th-44);cx.fillStyle='#6B4423';cx.beginPath();cx.arc(0,-12,9,0,Math.PI*2);cx.fill();cx.fillStyle='#7a5230';cx.fillRect(-8,-8,16,10);cx.fillStyle='#4a2e12';cx.beginPath();cx.arc(-5,-18,3.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(5,-18,3.5,0,Math.PI*2);cx.fill();cx.fillStyle='#ff1100';cx.fillRect(-5,-15,3,2);cx.fillRect(2,-15,3,2);cx.fillStyle='#2a3518';cx.beginPath();cx.arc(0,-12,9,Math.PI,0);cx.fill();

function drawProjs(){
  projs.forEach(p=>{
    const sx=p.x-camX,sy=p.y-camY;if(sx<-30||sx>VW+30||sy<-30||sy>VH+30)return;
    cx.save();cx.translate(sx,sy);cx.rotate(p.rot);
    if(p.type==='shell'){const g=cx.createLinearGradient(-9,0,9,0);g.addColorStop(0,'#8b6000');g.addColorStop(.3,'#daa520');g.addColorStop(1,'#7a5500');cx.fillStyle=g;cx.fillRect(-9,-3,17,6);cx.fillStyle='#aaa';cx.beginPath();cx.moveTo(8,-3);cx.lineTo(13,0);cx.lineTo(8,3);cx.closePath();cx.fill();}
    else if(p.type==='cannonball'){
      // Big glowing cannonball
      cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(0,0,10,0,Math.PI*2);cx.fill();
      cx.fillStyle='#3a3a3a';cx.beginPath();cx.arc(-2,-2,5,0,Math.PI*2);cx.fill();
      const gl=cx.createRadialGradient(10,0,0,10,0,18);gl.addColorStop(0,'rgba(255,200,0,0.9)');gl.addColorStop(.5,'rgba(255,100,0,.6)');gl.addColorStop(1,'transparent');cx.fillStyle=gl;cx.beginPath();cx.arc(10,0,18,0,Math.PI*2);cx.fill();
    }
    else if(p.type==='feather'){cx.fillStyle='#f0f0d0';cx.beginPath();cx.ellipse(0,0,8,3,0,0,Math.PI*2);cx.fill();}
    else if(p.type==='normal'){cx.fillStyle='#ffdd44';cx.fillRect(-10,-2,18,4);cx.fillStyle='#aaffaa';cx.fillRect(8,-5,5,10);}
    else if(p.type==='poison'){cx.fillStyle='#44ff88';cx.fillRect(-10,-2,18,4);cx.fillStyle='#00aa55';cx.fillRect(8,-5,5,10);}
    else if(p.type==='explode'){cx.fillStyle='#ff6600';cx.fillRect(-10,-2,18,4);cx.fillStyle='#ff0000';cx.fillRect(8,-5,5,10);}
    else if(p.type==='grenade'){cx.fillStyle='#556b2f';cx.beginPath();cx.arc(0,0,6,0,Math.PI*2);cx.fill();cx.fillStyle='#888';cx.fillRect(-1,-10,3,6);}
    cx.restore();
  });
  shurs.forEach(s=>{
    const sx=s.x-camX,sy=s.y-camY;if(sx<-20||sx>VW+20||sy<-20||sy>VH+20)return;
    cx.save();cx.translate(sx,sy);cx.rotate(s.rot);
    cx.fillStyle=s.returning?'#00eeff':'#cccccc';
    for(let i=0;i<4;i++){cx.save();cx.rotate(i*Math.PI/2);cx.beginPath();cx.moveTo(0,0);cx.lineTo(9,-4);cx.lineTo(0,9);cx.closePath();cx.fill();cx.restore();}
    cx.fillStyle='#777';cx.beginPath();cx.arc(0,0,3,0,Math.PI*2);cx.fill();cx.restore();
  });
  // Spider webs
  nets.forEach(n=>{
    const sx=n.x-camX,sy=n.y-camY;if(sx<-50||sx>VW+50||sy<-50||sy>VH+50)return;
    cx.save();cx.translate(sx,sy);
    if(n.webSpin!==undefined)cx.rotate(n.webSpin||0);
    const pulse=.5+.5*Math.sin(Date.now()/80);

    if(n.isWeb){
      // Draw spider web pattern
      const rad=n.hit?22:14;
      const webColor=n.hit?`rgba(200,240,255,${0.7+pulse*0.3})`:`rgba(180,230,255,${0.5+pulse*0.3})`;
      cx.strokeStyle=webColor;cx.lineWidth=1;
      // Spokes
      const spokes=n.hit?8:6;
      for(let si=0;si<spokes;si++){
        const a=si*Math.PI/spokes*2;
        cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);cx.stroke();
      }
      // Rings
      const rings=n.hit?4:3;
      for(let ri=1;ri<=rings;ri++){
        const r2=rad*ri/rings;
        cx.beginPath();
        cx.moveTo(r2,0);
        for(let si=0;si<spokes;si++){
          const a=si*Math.PI/spokes*2;
          cx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
        }
        cx.closePath();cx.stroke();
      }
      // Center dot
      cx.fillStyle=n.hit?'rgba(0,200,255,0.8)':'rgba(150,220,255,0.6)';
      cx.beginPath();cx.arc(0,0,n.hit?5:3,0,Math.PI*2);cx.fill();
      if(n.hit){cx.shadowBlur=12;cx.shadowColor='#00ddff';cx.fillStyle=`rgba(0,200,255,${0.1+pulse*0.15})`;cx.beginPath();cx.arc(0,0,20,0,Math.PI*2);cx.fill();cx.shadowBlur=0;}
    } else {
      // Legacy net appearance
      cx.strokeStyle=`rgba(0,255,255,${.5+pulse*.4})`;cx.lineWidth=1.5;const rad=n.hit?16:12;
      for(let ni=0;ni<(n.hit?8:6);ni++){const a=ni*Math.PI/(n.hit?4:3);cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);cx.stroke();}
      for(let ni=0;ni<(n.hit?4:3);ni++){cx.beginPath();cx.arc(0,0,4+ni*4,0,Math.PI*2);cx.stroke();}
      if(n.hit){cx.fillStyle=`rgba(0,255,255,${.1+pulse*.1})`;cx.beginPath();cx.arc(0,0,15,0,Math.PI*2);cx.fill();}else{cx.fillStyle='#fff';cx.beginPath();cx.arc(0,0,3,0,Math.PI*2);cx.fill();}
    }
    cx.restore();
  });
}

  else if(fr2>surfRow){cx.fillStyle='rgba(255,50,50,.8)';cx.font='bold 11px Courier New';cx.textAlign='center';cx.fillText('⚠ UNDERGROUND -5HP/s',VW/2,VH-60);cx.textAlign='left';}
  // Title
  cx.fillStyle='rgba(180,120,255,0.6)';cx.font='bold 11px Courier New';cx.textAlign='center';cx.fillText('Kogechairo no Akuma o yosetsukenai',VW/2,VH-72);cx.textAlign='left';
}

function updHUDDom(){
  document.getElementById('hpD').textContent=Math.max(0,P.hp);
  document.getElementById('shurD').textContent=P.shurSlots.filter(s=>s==='loaded').length;
  document.getElementById('killD').textContent=P.kills;
  document.getElementById('ninjaD').textContent=ninjas.length;
  document.getElementById('scoreD').textContent=score;
  document.getElementById('modeD').textContent=gSt==='intro'?'INTRO':gSt==='lobby'?'LOBBY':'LVL '+(curLvl+1)+': '+LEVELS[curLvl].name;
}

function drawDead(){
  cx.fillStyle='rgba(0,0,0,.65)';cx.fillRect(0,0,VW,VH);cx.textAlign='center';
  cx.fillStyle='#f22';cx.font='bold 48px Courier New';cx.fillText('YOU DIED',VW/2,VH/2-30);
  cx.fillStyle='#fd0';cx.font='20px Courier New';cx.fillText('Score: '+score,VW/2,VH/2+10);
  cx.fillStyle='#aaa';cx.font='14px Courier New';cx.fillText('SPACE to restart',VW/2,VH/2+45);cx.textAlign='left';
}

function drawWin(){
  cx.fillStyle='rgba(0,20,0,.75)';cx.fillRect(0,0,VW,VH);cx.textAlign='center';
  const pulse=0.7+0.3*Math.sin(Date.now()/200);
  cx.fillStyle=`rgba(0,255,100,${pulse})`;cx.font='bold 44px Courier New';cx.fillText('LEVEL CLEAR!',VW/2,VH/2-30);
  cx.fillStyle='#ffd700';cx.font='22px Courier New';cx.fillText('Score: '+score,VW/2,VH/2+14);
  cx.fillStyle='#aaffaa';cx.font='13px Courier New';cx.fillText('Returning to lobby...',VW/2,VH/2+46);cx.textAlign='left';
}

// ── Main Loop ─────────────────────────────────────────────
function update(){
  if(gSt==='intro'){
    updIntro();
    handleIntroInput();
    clrJ();return;
  }

  if(jp['Equal']){if(gSt==='dead'){clrJ();return;}paused=!paused;pauseSelect=0;clrJ();return;}
  if(paused){
    if(jp['ArrowUp'])pauseSelect=Math.max(0,pauseSelect-1);
    if(jp['ArrowDown'])pauseSelect=Math.min(1,pauseSelect+1);
    if(jp['Enter']){if(pauseSelect===0)paused=false;else{paused=false;if(gSt==='level')enterLvl(curLvl);else enterLobby();}}
    clrJ();return;
  }
  if(gSt==='dead'){
    if(!loseSndPlayed){loseSndPlayed=true;sndLose();}
    if(jp['Space']){gSt='level';enterLvl(curLvl);}
    clrJ();return;
  }
  if(gSt==='win'){
    clrJ();return;
  }
  updBomb();
  updPlayer();updCam();updBears();updTanks();
  updGoose();updKarateBear();
  updNinjas();
  updProjs();updNets();updLava();updParts();
  updBearTraps();
  updHUDDom();
  if(P.hp<=0){gSt='dead';bombActive=false;document.getElementById('timerBar').style.display='none';document.getElementById('timerHud').style.display='none';}
  clrJ();
}

function draw(){
  cx.clearRect(0,0,VW,VH);
  if(gSt==='intro'){drawIntro();return;}
  drawBg();drawWorld();
  drawBearTraps();
  if(gSt==='lobby')drawPortals();
  if(gSt==='level')drawEgg();
  drawParts();drawProjs();
  drawGoose();drawKarateBear();
  tanks.forEach(drawTank);
  bears.forEach(drawBear);
  ninjas.forEach((n,i)=>drawNinja(n,i));
  drawPlayer();drawHUD();
  if(gSt==='dead')drawDead();
  if(paused)drawPauseMenu();
}

function loop(){update();draw();requestAnimationFrame(loop);}

// Init
gSt='intro';
introState='start';
introLineIdx=0;introCharIdx=0;introDisplayText='';introChoiceVisible=false;
loop();
</script>
